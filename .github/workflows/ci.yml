name: CI

# Not for changes that touch only the docs, the design files, the website, the phone apps' notes
# or the other workflows. Only the Markdown files at the top count as docs: the core's packages
# list their READMEs, so a change to those still runs it.
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - design/**
      - website/**
      - android/**
      - ios/**
      - .github/*.md
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/website.yml
      - .github/workflows/release.yml
      - .github/workflows/windows*.yml
  pull_request:
    paths-ignore:
      - '*.md'
      - design/**
      - website/**
      - android/**
      - ios/**
      - .github/*.md
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/website.yml
      - .github/workflows/release.yml
      - .github/workflows/windows*.yml

# A newer push to a pull request makes an older run's results moot. On main, a run that has
# started always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Check formatting
        run: >
          xcrun swift-format lint --strict --recursive --configuration .swift-format
          mac/Reqly mac/ReqlyHelper mac/ReqlyMacKit/Sources mac/ReqlyMacKit/Tests mac/ReqlyMacKit/Package.swift
          core/Sources core/Tests core/Package.swift
          core-interface/Sources core-interface/Tests core-interface/Package.swift
          windows/ReqlyCore/Sources windows/ReqlyCore/Tests windows/ReqlyCore/Package.swift
          linux/Sources linux/Tests linux/Package.swift

      # When a test fails, what it found also shows on the run's summary page.
      - name: Test the core
        run: |
          set -o pipefail
          swift test --package-path core 2>&1 | tee "$RUNNER_TEMP/core.log" || {
            grep "recorded an issue" "$RUNNER_TEMP/core.log" | sed 's/^/::error::/'
            exit 1
          }

      - name: Test the Mac modules
        run: |
          set -o pipefail
          swift test --package-path mac/ReqlyMacKit 2>&1 | tee "$RUNNER_TEMP/mac.log" || {
            grep "recorded an issue" "$RUNNER_TEMP/mac.log" | sed 's/^/::error::/'
            exit 1
          }

      # The core interface, which the Linux app calls, and which answers the Windows app's messages.
      - name: Test the core interface
        run: |
          set -o pipefail
          swift test --package-path core-interface 2>&1 | tee "$RUNNER_TEMP/core-interface.log" || {
            grep "recorded an issue" "$RUNNER_TEMP/core-interface.log" | sed 's/^/::error::/'
            exit 1
          }

      # ReqlyCore.dll's C functions, and the parts of Windows' own pieces that aren't Windows calls.
      - name: Test the Windows app's C interface
        run: |
          set -o pipefail
          swift test --package-path windows/ReqlyCore 2>&1 | tee "$RUNNER_TEMP/windows.log" || {
            grep "recorded an issue" "$RUNNER_TEMP/windows.log" | sed 's/^/::error::/'
            exit 1
          }

      - name: Build the app
        run: >
          xcodebuild build -project mac/Reqly.xcodeproj -scheme Reqly -configuration Debug
          CODE_SIGNING_ALLOWED=NO

  # The Mac app optimized, as release.yml builds it, with the same Xcode, for Apple silicon and
  # Intel: the Debug build above is for the runner's own chip alone. On a job of its own, so it
  # runs beside build-and-test, and the run takes no longer.
  mac-release-build:
    name: Mac app's release build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest Xcode on the runner
        run: sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Build the app for release
        run: >
          xcodebuild build -project mac/Reqly.xcodeproj -scheme Reqly -configuration Release
          -destination 'generic/platform=macOS' CODE_SIGNING_ALLOWED=NO

  # The core: the engine, certificates, rules, scripts, storage and file formats, which the
  # Windows and Linux apps share. The Mac-only modules are in mac/ReqlyMacKit, so they stay
  # out. On x64 and arm64, with the Swift that Reqly for Linux is built with.
  core-on-linux:
    name: Core on Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install SQLite and zlib
        run: apt-get update && apt-get install -y libsqlite3-dev zlib1g-dev

      - name: Build the core
        run: linux/scripts/core.sh build

      - name: Test the core
        run: linux/scripts/core.sh test

      - name: Test the core interface
        run: linux/scripts/core.sh test --package core-interface

      - name: Test the Windows app's C interface
        run: linux/scripts/core.sh test --package ReqlyCore

  # Reqly for Linux (linux/): the app, and its own parts, which it hands the core: your desktop's
  # proxy setting, the certificate's key in your keyring and the places apps trust it, and which
  # app sent each request. Built against Ubuntu 24.04's development packages, the oldest Reqly
  # supports, as linux/docker/Dockerfile installs them. The tests run as root in the container, so
  # the root helper's tests change the container's own list of certificates; they start a
  # Secret Service of their own under dbus-run-session, and never need a desktop. The app's
  # self-check then runs headless, with stand-ins for everything it could change, as the image's
  # ordinary account, ubuntu, as it does in Docker: one of its parts takes a folder's write
  # permission away, which root ignores.
  linux-app:
    name: Linux app (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the development packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          libsqlite3-dev zlib1g-dev pkg-config
          libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libsecret-1-dev
          libnss3-tools gsettings-desktop-schemas dbus gnome-keyring ca-certificates
          libgtk-4-bin xvfb xauth at-spi2-core libglib2.0-bin
          fonts-cantarell fonts-dejavu-core adwaita-icon-theme librsvg2-common
          libgl1-mesa-dri libegl1 x11-utils python3-pyatspi imagemagick

      - name: Build the Linux app
        run: linux/scripts/app.sh build

      # In a container, steps run in sh unless they say otherwise, and Ubuntu's sh has no pipefail.
      - name: Test the Linux app
        shell: bash
        run: |
          set -o pipefail
          linux/scripts/app.sh test 2>&1 | tee "$RUNNER_TEMP/linux.log" || {
            grep "recorded an issue" "$RUNNER_TEMP/linux.log" | sed 's/^/::error::/'
            exit 1
          }

      # The checkout and its build go to ubuntu, whose build of the program then has nothing to do.
      # It gets a temporary folder of its own, since SwiftPM keeps its locks there, and root's are
      # left behind.
      - name: Run the app's self-check
        run: |
          chown -R ubuntu: .
          install -d -o ubuntu -g ubuntu /tmp/ubuntu
          runuser -u ubuntu -- env TMPDIR=/tmp/ubuntu linux/scripts/app.sh self-check

  # Reqly for Linux's release program, as a desktop runs it: Swift's runtime inside, and only the
  # system's libraries beside it. It's built once, here, for the self-check on the newer systems
  # below, beside the job above rather than in it, since a job that needs another waits for all of
  # it, tests and self-check too. Kept with the run for three days, for running those again.
  linux-app-release:
    name: Linux app's release build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the development packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          libsqlite3-dev zlib1g-dev pkg-config
          libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev libsecret-1-dev

      - name: Build the release program
        run: linux/scripts/app.sh build -c release --product reqly --static-swift-stdlib

      # Artifacts don't keep files' modes, so the program goes in a tar.
      - name: Pack it
        run: tar -C linux/.build/release -cf linux/.build/reqly-${{ matrix.arch }}.tar reqly

      - name: Keep it with the run
        uses: actions/upload-artifact@v7
        with:
          name: reqly-linux-app-${{ matrix.arch }}
          path: linux/.build/reqly-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 3

  # The release program's whole self-check on the newer systems Reqly for Linux supports, Debian 13
  # (GTK 4.18, libadwaita 1.7) and Ubuntu 26.04 (GTK 4.22, libadwaita 1.9), where libadwaita moves
  # the focus and draws text in ways 1.5 doesn't. Each gets the libraries the program needs, what
  # the self-check runs on headless, as linux/docker/Dockerfile has for Ubuntu 24.04, and the
  # desktop's own font, as GNOME sets it. The checkout is where the build's was, so the program
  # finds its icons in it, and the self-check runs as an ordinary account, as above.
  linux-app-elsewhere:
    name: Linux app on ${{ matrix.system.name }} (${{ matrix.arch }})
    needs: linux-app-release
    strategy:
      fail-fast: false
      matrix:
        system:
          - { name: Debian 13, image: 'debian:13', fonts: '', font: 'Cantarell 11' }
          - { name: Ubuntu 26.04, image: 'ubuntu:26.04', fonts: 'fonts-ubuntu fonts-adwaita', font: 'Ubuntu Sans 11' }
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.system.image }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install GTK and what the self-check runs on
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >
          apt-get update && apt-get install -y --no-install-recommends
          libgtk-4-1 libadwaita-1-0 libgtksourceview-5-0 libsecret-1-0 libsqlite3-0 zlib1g libstdc++6
          ca-certificates tzdata libgl1-mesa-dri libegl1
          fonts-cantarell fonts-dejavu-core adwaita-icon-theme librsvg2-common ${{ matrix.system.fonts }}
          libgtk-4-bin xvfb xauth dbus at-spi2-core python3-pyatspi libglib2.0-bin x11-utils imagemagick

      # Debian 13's GNOME has no Adwaita Sans package, so it's Cantarell, GNOME's font before 48.
      - name: Use the desktop's font
        run: |
          mkdir -p /etc/gtk-4.0
          printf '[Settings]\ngtk-font-name=%s\n' '${{ matrix.system.font }}' > /etc/gtk-4.0/settings.ini

      - name: Get the release program
        uses: actions/download-artifact@v8
        with:
          name: reqly-linux-app-${{ matrix.arch }}
          path: linux/.build

      - name: Unpack it
        run: tar -C linux/.build -xf linux/.build/reqly-${{ matrix.arch }}.tar

      - name: Run its self-check
        run: |
          useradd --create-home tester
          runuser -u tester -- linux/scripts/self-check.sh linux/.build/reqly

  # libReqlyCore.so for release, with the parts of Swift's runtime it needs and its debug
  # information apart (linux/scripts/stage-core.sh). The Linux app won't load it. It's built
  # here to check the C interface's release build, and that a release build with Swift's
  # runtime beside it starts on every system Reqly for Linux supports. A release build shares
  # nothing with the tests' builds, so it runs beside them, and the checks below don't wait for
  # the tests. Kept with the run for two weeks.
  core-release-on-linux:
    name: Core's release build on Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install SQLite and zlib
        run: apt-get update && apt-get install -y libsqlite3-dev zlib1g-dev

      - name: Build libReqlyCore.so
        run: linux/scripts/core.sh build --package ReqlyCore -c release --product ReqlyCore

      - name: Gather it with Swift's runtime
        run: linux/scripts/stage-core.sh linux/.build/core

      # Artifacts don't keep files' modes, so the files go in a tar.
      - name: Pack it
        run: tar -C linux/.build -cf linux/.build/core-${{ matrix.arch }}.tar core

      - name: Keep it with the run
        uses: actions/upload-artifact@v7
        with:
          name: reqly-linux-core-${{ matrix.arch }}
          path: linux/.build/core-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 14

      # Swift's image has a toolchain under /usr, as a developer's computer may, and the core
      # has to load its own runtime even so.
      - name: Check that it uses its own Swift runtime
        run: linux/scripts/check-core.sh linux/.build/core

  # The release build on each system Reqly for Linux supports, with only SQLite, zlib and
  # libstdc++ added and no Swift (linux/scripts/check-core.sh): it finds every library it needs,
  # sends a request through itself, and writes a report when it crashes.
  core-starts-on-linux:
    name: Core starts on ${{ matrix.system.name }} (${{ matrix.arch }})
    needs: core-release-on-linux
    strategy:
      fail-fast: false
      matrix:
        system:
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04' }
          - { name: Ubuntu 26.04, image: 'ubuntu:26.04' }
          - { name: Debian 13, image: 'debian:13' }
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.system.image }}
    timeout-minutes: 15
    steps:
      # The images have no git, so checkout downloads the files instead. Actions run in them on
      # the runner's own Node, which works on arm64 too, as these images use glibc; in Alpine's,
      # it works only on x64.
      - uses: actions/checkout@v5

      - name: Install SQLite, zlib and libstdc++
        env:
          DEBIAN_FRONTEND: noninteractive
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-0 zlib1g libstdc++6

      - name: Get the release build
        uses: actions/download-artifact@v8
        with:
          name: reqly-linux-core-${{ matrix.arch }}
          path: linux/.build

      - name: Unpack it
        run: tar -C linux/.build -xf linux/.build/core-${{ matrix.arch }}.tar

      - name: Check that it starts
        run: linux/scripts/check-core.sh linux/.build/core
