# How winget installs Reqly: Velopack's Setup.exe, for the current user, from the version's
# release on GitHub. Reqly updates itself after that, so winget installs a newer one over it.
PackageIdentifier: Reqly.Reqly
PackageVersion: {version}
InstallerType: exe
Scope: user
InstallModes:
  - interactive
  - silent
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
UpgradeBehavior: install
# Velopack's uninstall entry is named after its package id.
ProductCode: Reqly.App
FileExtensions:
  - reqly
  - har
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/parsamlm/reqly/releases/download/windows-v{version}/Reqly.App-win-Setup.exe
    InstallerSha256: {sha256}
ManifestType: installer
ManifestVersion: 1.10.0
